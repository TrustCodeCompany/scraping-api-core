name: Build & Push Docker Image

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git tags
        run: git fetch --tags

      - name: Get latest tag
        id: latest_tag
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Calculate next version (patch)
        id: version
        run: |
          VERSION=${{ steps.latest_tag.outputs.last_tag }}
          VERSION=${VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            -t trustcodesac/tb-scraping-core:${{ steps.version.outputs.new_tag }} \
            -t trustcodesac/tb-scraping-core:latest .

      - name: Push Docker image
        run: |
          docker push trustcodesac/tb-scraping-core:${{ steps.version.outputs.new_tag }}
          docker push trustcodesac/tb-scraping-core:latest

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}
